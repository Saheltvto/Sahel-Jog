<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حسابداری هوشمند ساحل نسخه جهازاقیانوس</title>

    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حسابداری هوشمند ساحل">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; height: 100vh; height: -webkit-fill-available; background-color: #060911; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Vazirmatn", "Segoe UI", Roboto, sans-serif; overflow: hidden; position: relative; }
        .bg-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; background: radial-gradient(circle, rgba(245,158,11,0.18) 0%, rgba(99,102,241,0.12) 50%, rgba(0,0,0,0) 70%); filter: blur(50px); border-radius: 50%; pointer-events: none; animation: pulseGlow 4s ease-in-out infinite alternate; }
        .splash-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(6,9,17,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 10; transition: opacity .6s cubic-bezier(.4,0,.2,1), visibility .6s; }
        .glass-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 35px 30px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(10px); max-width: 85%; width: 320px; animation: floatUp .7s cubic-bezier(.16,1,.3,1); }
        .app-icon { width: 100px; height: 100px; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,0,0,0.4), 0 0 20px rgba(245,158,11,0.25); margin-bottom: 20px; object-fit: cover; border: 1px solid rgba(255,255,255,0.15); }
        .app-title { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg,#fff 0%,#cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; letter-spacing: -0.3px; }
        .app-subtitle { font-size: .82rem; color: #94a3b8; margin-bottom: 24px; font-weight: 400; }
        .loader-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; position: relative; }
        .loader-progress { width: 40%; height: 100%; background: linear-gradient(90deg,#f59e0b,#fbbf24); border-radius: 10px; position: absolute; animation: loadingBar 1.5s ease-in-out infinite; }
        iframe { width: 100%; height: 100%; border: none; outline: none; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        .splash-hidden { opacity: 0; visibility: hidden; }
        @keyframes floatUp { from { opacity:0; transform: translateY(20px) scale(.96);} to { opacity:1; transform: translateY(0) scale(1);} }
        @keyframes pulseGlow { 0% { transform: translate(-50%,-50%) scale(.9); opacity:.6;} 100% { transform: translate(-50%,-50%) scale(1.2); opacity:1;} }
        @keyframes loadingBar { 0% { left:-40%;} 50% { left:40%; width:60%;} 100% { left:100%; width:20%;} }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="splash-container" id="splashScreen">
        <div class="glass-card">
            <img src="icon.png" alt="لوگو برنامه" class="app-icon" onerror="this.style.display='none'">
            <div class="app-title">حسابداری هوشمند ساحل نسخه جهاز اقیانوس</div>
            <div class="app-subtitle">در حال بارگذاری ایمن...</div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
        </div>
    </div>

    <iframe
        id="appIframe"
        allow="fullscreen; camera; microphone"
        sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>

    <script>
        // ==========================================================
        // مدیریت نشست ماندگار در سطح صفحه‌ی گیت‌هاب (top-level).
        // توکن هم در localStorage و هم در خودِ آدرس URL این صفحه
        // نگه‌داری می‌شود تا مستقل از رفتار storage در آیفون باشد.
        // ==========================================================
        const GAS_APP_URL = 'https://script.google.com/macros/s/AKfycbzSeOv5ZkgBy1tW5hzPQq-wvG17pGJ8aN3JOpqW0wmZ4IMGEgiAWn_ntpojKaZpiEgl/exec';
        const TOKEN_KEY = 'sahel_app_token';

        function getStoredToken() {
            // اول از خودِ URL این صفحه بخون (قابل‌اعتمادترین منبع)
            try {
                const urlToken = new URLSearchParams(window.location.search).get('token');
                if (urlToken) {
                    saveToken(urlToken);
                    return urlToken;
                }
            } catch (e) {}
            // در غیر این صورت از localStorage (ممکنه در آیفون پاک شده باشه)
            try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
        }
        function saveToken(token) {
            try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
        }
        function clearToken() {
            try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
        }
        function buildIframeSrc() {
            const token = getStoredToken();
            const params = new URLSearchParams();
            if (token) params.set('token', token);
            params.set('embedded', '1');
            return GAS_APP_URL + '?' + params.toString();
        }
        function isTrustedOrigin(origin) {
            try {
                return origin === 'https://script.google.com' || /\.googleusercontent\.com$/.test(new URL(origin).hostname);
            } catch (e) {
                return false;
            }
        }

        // دریافت پیام از داخل اپ (بعد از لاگین موفق یا خروج)
        window.addEventListener('message', function (event) {
            if (!isTrustedOrigin(event.origin)) return;

            const data = event.data;
            if (!data || typeof data !== 'object') return;

            if (data.type === 'SAHEL_AUTH' && data.token) {
                saveToken(data.token);
                // توکن رو توی آدرس نمایشی همین صفحه هم می‌نویسیم
                // تا اگر کاربر الان صفحه رو Bookmark/Add to Home Screen کنه، توکن همراهش بمونه
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.set('token', data.token);
                    window.history.replaceState({}, '', url.toString());
                } catch (e) {}
            } else if (data.type === 'SAHEL_LOGOUT') {
                clearToken();
                try {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('token');
                    window.history.replaceState({}, '', url.toString());
                } catch (e) {}
            }
        });

        const splash = document.getElementById('splashScreen');
        const appIframe = document.getElementById('appIframe');

        function hideSplash() {
            splash.classList.add('splash-hidden');
        }

        appIframe.addEventListener('load', () => {
            setTimeout(hideSplash, 500);
        });
        setTimeout(hideSplash, 3000); // فالبک اطمینان

        // آدرس iframe را همراه با توکن ذخیره‌شده (در صورت وجود) تنظیم می‌کنیم
        appIframe.src = buildIframeSrc();
    </script>

</body>
</html>
